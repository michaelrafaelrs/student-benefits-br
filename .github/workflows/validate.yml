name: Validar catálogo

on:
  push:
    paths:
      - 'data/benefits/**'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/benefits/**'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - run: python scripts/validate_catalog.py
